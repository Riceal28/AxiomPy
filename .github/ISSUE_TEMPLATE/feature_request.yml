name: Feature request
description: Suggest an improvement or new workflow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow is difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or related tools.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request fits the Windows FFmpeg desktop workflow.
          required: true
