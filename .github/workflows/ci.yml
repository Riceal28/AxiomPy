name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile sources
        run: python -m compileall -q src

      - name: Run tests
        shell: pwsh
        run: |
          pytest -q --tb=short -p no:cacheprovider 2>&1 |
            Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) {
            $text = Get-Content -LiteralPath pytest-output.txt -Raw
            if ($text.Length -gt 6000) {
              $text = $text.Substring($text.Length - 6000)
            }
            $text = $text.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=pytest failure::$text"
            exit 1
          }

      - name: Check installed dependencies
        run: python -m pip check
