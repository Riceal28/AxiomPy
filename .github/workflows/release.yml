name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,package]"

      - name: Run test suite
        run: pytest -q -p no:cacheprovider

      - name: Ensure FFmpeg tools are available
        run: |
          $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
            choco install ffmpeg -y --no-progress
            $ffmpeg = Get-Command ffmpeg.exe -ErrorAction Stop
          }

          # Chocolatey puts a small shim on PATH.  PyInstaller must bundle the
          # real binaries from the package's tools directory; copying a shim
          # produces the "..\lib\ffmpeg\tools\..." missing-file error at runtime.
          $candidates = @()
          $roots = @()
          if ($env:ProgramData) {
            $roots += Join-Path $env:ProgramData "chocolatey\lib"
          }
          if ($env:ChocolateyInstall) {
            $roots += Join-Path $env:ChocolateyInstall "lib"
          }
          $roots = $roots | Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -Unique
          if ($roots) {
            $candidates += Get-ChildItem -Path $roots -Recurse -Filter ffmpeg.exe `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -ge 1MB -and -not (Test-Path ($_.FullName + ".shim")) }
          }
          if ($ffmpeg) {
            $path_candidate = Get-Item -LiteralPath $ffmpeg.Source -ErrorAction SilentlyContinue
            if ($path_candidate -and $path_candidate.Length -ge 1MB) {
              $candidates += $path_candidate
            }
          }
          $real = $candidates | Select-Object -First 1
          if (-not $real) {
            throw "Could not locate real FFmpeg binaries (only shims were found)."
          }
          $bin = Split-Path -Parent $real.FullName
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe", "ffplay.exe")) {
            if (-not (Test-Path -LiteralPath (Join-Path $bin $name))) {
              throw "Missing $name next to $($real.FullName)"
            }
          }
          "AXIOM_FFMPEG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build portable package
        run: .\packaging\build.ps1

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            $env:GITHUB_REF_NAME
          }
          $version = $tag.TrimStart("v")
          $asset = "AxiomPy-$version-win64.zip"
          Compress-Archive -Path "dist\AxiomPy" -DestinationPath $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $title = "AxiomPy $env:RELEASE_VERSION"
          $asset = $env:RELEASE_ASSET
          $notes = "docs/releases/$tag.md"

          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset "$asset.sha256" --clobber
          } elseif (Test-Path -LiteralPath $notes) {
            gh release create $tag $asset "$asset.sha256" `
              --title $title `
              --notes-file $notes `
              --latest
          } else {
            gh release create $tag $asset "$asset.sha256" `
              --title $title `
              --generate-notes `
              --latest
          }
