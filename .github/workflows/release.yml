name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,package]"

      - name: Run test suite
        run: pytest -q -p no:cacheprovider

      - name: Ensure FFmpeg tools are available
        run: |
          $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
            choco install ffmpeg -y --no-progress
            $ffmpeg = Get-Command ffmpeg.exe -ErrorAction Stop
          }
          $bin = Split-Path -Parent $ffmpeg.Source
          "AXIOM_FFMPEG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build portable package
        run: .\packaging\build.ps1

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            $env:GITHUB_REF_NAME
          }
          $version = $tag.TrimStart("v")
          $asset = "AxiomPy-$version-win64.zip"
          Compress-Archive -Path "dist\AxiomPy" -DestinationPath $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $title = "AxiomPy $env:RELEASE_VERSION"
          $asset = $env:RELEASE_ASSET
          $notes = "docs/releases/$tag.md"

          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset "$asset.sha256" --clobber
          } elseif (Test-Path -LiteralPath $notes) {
            gh release create $tag $asset "$asset.sha256" `
              --title $title `
              --notes-file $notes `
              --latest
          } else {
            gh release create $tag $asset "$asset.sha256" `
              --title $title `
              --generate-notes `
              --latest
          }
