name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,package]"

      - name: Run test suite
        run: pytest -q -p no:cacheprovider

      - name: Install compatible FFmpeg
        run: |
          # Pin FFmpeg 7.1.1 for NVENC API 13.0 compatibility.  FFmpeg 8.x
          # requires NVENC 13.1 / NVIDIA driver 610+, which breaks systems
          # whose driver reports API 13.0.
          $version = "7.1.1"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$version/ffmpeg-$version-essentials_build.zip"
          $expected = "04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-$version.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "FFmpeg archive checksum mismatch: $actual"
          }
          $dest = Join-Path $env:RUNNER_TEMP "ffmpeg-$version"
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $real = Get-ChildItem -Path $dest -Recurse -Filter ffmpeg.exe |
            Where-Object { $_.Directory.Name -eq "bin" } |
            Select-Object -First 1
          if (-not $real) {
            throw "Could not locate the extracted FFmpeg binaries."
          }
          $bin = $real.DirectoryName
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe", "ffplay.exe")) {
            if (-not (Test-Path -LiteralPath (Join-Path $bin $name))) {
              throw "Missing $name next to $($real.FullName)"
            }
          }
          $versionText = & $real.FullName -version 2>&1 |
            Select-Object -First 1
          if ($versionText -notmatch "ffmpeg version $version") {
            throw "Unexpected FFmpeg version: $($versionText -join ' ')"
          }
          "AXIOM_FFMPEG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build portable package
        run: .\packaging\build.ps1

      - name: Verify portable packages
        run: |
          .\packaging\verify.ps1 -Package "dist\AxiomPy"
          .\packaging\verify.ps1 -Package "dist\AxiomPy-noffmpeg" -NoFfmpeg

      - name: Create release archives and checksums
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            $env:GITHUB_REF_NAME
          }
          $version = $tag.TrimStart("v")
          $packages = @(
            @{
              Source = "dist\AxiomPy"
              Asset = "AxiomPy-$version-win64.zip"
            },
            @{
              Source = "dist\AxiomPy-noffmpeg"
              Asset = "AxiomPy-$version-win64-noffmpeg.zip"
            }
          )
          $assets = @()
          foreach ($package in $packages) {
            if (-not (Test-Path -LiteralPath $package.Source)) {
              throw "Missing package directory: $($package.Source)"
            }
            $stagingRoot = Join-Path $env:RUNNER_TEMP "release-$($package.Asset)"
            $stagingApp = Join-Path $stagingRoot "AxiomPy"
            if (Test-Path -LiteralPath $stagingRoot) {
              Remove-Item -LiteralPath $stagingRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Path $stagingRoot -Force | Out-Null
            Copy-Item -LiteralPath $package.Source -Destination $stagingApp -Recurse
            Compress-Archive -Path $stagingApp -DestinationPath $package.Asset -Force
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.Asset).Hash.ToLowerInvariant()
            "$hash  $($package.Asset)" |
              Set-Content -Encoding ascii "$($package.Asset).sha256"
            $assets += $package.Asset
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_ASSETS=$($assets -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $title = "AxiomPy $env:RELEASE_VERSION"
          $notes = "docs/releases/$tag.md"
          $files = @()
          foreach ($asset in $env:RELEASE_ASSETS.Split(";")) {
            $files += $asset
            $files += "$asset.sha256"
          }

          if (gh release view $tag 2>$null) {
            gh release upload $tag @files --clobber
          } elseif (Test-Path -LiteralPath $notes) {
            gh release create $tag @files `
              --title $title `
              --notes-file $notes `
              --latest
          } else {
            gh release create $tag @files `
              --title $title `
              --generate-notes `
              --latest
          }
