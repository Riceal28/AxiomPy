[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-py"
version = "0.1.0"
description = "Axiom FFmpeg UI - Python/PySide6 rewrite of the WPF original"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.9,<6.10"]
dev = ["pytest>=8", "pytest-qt>=4.4"]
package = ["pyinstaller>=6.16"]

[project.scripts]
axiom-cli = "axiom.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

